name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      # Full history, not the default depth-1 checkout. AreaFileCitationSurvivalTests reads
      # `git log --diff-filter=D` to find deleted area files and prove their citations were
      # retired with them. A shallow checkout carries no history, so that search returns
      # nothing - and the class refuses to pass on an empty set rather than comparing nothing
      # against nothing and reporting success. It was right to fail; the answer is to give it
      # the history, never to weaken the check.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The solution is named on every step, deliberately. A bare `dotnet restore` at
      # the repository root finds the tracked but empty SecureAD.Next.sln beside this
      # file, which restores, builds and tests nothing and reports success - a green
      # check measuring nothing, which is worse than no check at all. See P-178.
      #
      # This workflow spent its whole life triggering on `master` in a repository whose
      # branch is `main`, so it had never run once and nothing said so. See P-177.
      - name: Restore
        run: dotnet restore next/SecureAD.Next.sln

      - name: Build
        run: dotnet build next/SecureAD.Next.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test next/SecureAD.Next.sln --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: ./TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
